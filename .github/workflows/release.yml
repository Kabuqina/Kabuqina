name: unbranded release candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing vX.Y.Z tag to build as an unbranded CI candidate"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Verify release configuration
        shell: pwsh
        run: ./scripts/check_release.ps1 -ExpectedVersion "${{ inputs.release_tag }}"

      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri

      - name: Build Python bundle
        shell: pwsh
        run: ./python/build_bundle.ps1 -Verify

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Decode signing cert
        shell: pwsh
        env:
          PFX: ${{ secrets.WIN_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX)) {
            Write-Host "WIN_PFX_BASE64 is not configured; skipping Authenticode certificate setup"
            exit 0
          }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx",
            [Convert]::FromBase64String("$env:PFX"))
          $thumb = (certutil -dump "$env:RUNNER_TEMP\cert.pfx" |
            Select-String -Pattern "Cert Hash\(sha1\):").Line.Split(":")[1].Trim()
          "WIN_CERT_THUMBPRINT=$thumb" >> $env:GITHUB_ENV

      - name: Build NSIS
        working-directory: tauri
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri build

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Kabuqina ${{ inputs.release_tag }} (unbranded CI candidate)
          body_path: docs/releases/${{ inputs.release_tag }}.md
          draft: true
          files: |
            tauri/target/release/bundle/nsis/*-setup.exe
