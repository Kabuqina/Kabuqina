document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

arent 60%),\n      linear-gradient(180deg, var(--kq-scene-desk-a) 0%, var(--kq-scene-desk) 55%, var(--kq-scene-desk-b) 100%);\n  }\n  .wrap { max-width: 1152px; margin: 0 auto; }\n\n  .eyebrow { display:flex; align-items:center; gap:12px; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--kq-scene-accent); font-weight:700; }\n  .eyebrow .rule { display:inline-block; width:26px; height:2px; background:currentColor; border-radius:2px; }\n  h1 { font-family: var(--font-serif); font-weight:600; font-size:40px; letter-spacing:.02em; color:var(--kq-scene-ink-strong); margin:10px 0 6px; }\n  .lede { max-width:820px; color:var(--kq-scene-ink); font-size:15px; margin:0; }\n  .lede b, .strong { color:var(--kq-scene-ink-strong); }\n\n  .callout { padding:12px 16px; border-radius:12px; background:var(--kq-scene-accent-soft); border:1px solid rgba(143,117,168,.3); font-size:13.5px; color:var(--kq-scene-ink); }\n\n  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:22px; }\n  .card {\n    background: var(--kq-scene-paper);\n    background-image: var(--kq-scene-noise);\n    border-radius:18px; padding:26px 28px;\n    box-shadow: var(--kq-scene-shadow-near), var(--kq-scene-shadow-far);\n  }\n  .card.span { grid-column:1 / -1; }\n  .sec-no { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--kq-scene-accent); font-weight:700; margin-bottom:16px; }\n  .note { font-size:13px; color:var(--kq-scene-muted); }\n  .note code { color:var(--kq-scene-accent); }\n\n  .swatch-row { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }\n  .sw h4 { margin:9px 0 1px; font-weight:600; color:var(--kq-scene-ink-strong); font-size:14px; }\n  .sw .hex { font-family:var(--font-mono); font-size:12px; color:var(--kq-scene-muted); }\n  .sw .chip { height:88px; border-radius:12px; box-shadow: inset 0 1px 0 rgba(255,255,255,.5); }\n\n  .mono { font-family:var(--font-mono); }\n  .pill { display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:.03em; }\n\n  /* token table */\n  table.tok { width:100%; border-collapse:collapse; font-size:12.5px; }\n  table.tok th, table.tok td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--kq-scene-card-border); vertical-align:middle; }\n  table.tok th { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--kq-scene-muted); font-weight:700; }\n  table.tok td.tk { font-family:var(--font-mono); color:var(--kq-scene-ink-strong); white-space:nowrap; }\n  table.tok td.v { font-family:var(--font-mono); color:var(--kq-scene-ink); white-space:nowrap; }\n  .dot { display:inline-block; width:14px; height:14px; border-radius:4px; vertical-align:-2px; margin-right:6px; border:1px solid rgba(90,74,106,.18); }\n  .tag-exist { background:rgba(107,85,128,.12); color:var(--kq-scene-accent); }\n  .tag-new   { background:rgba(212,176,128,.22); color:#8a6a35; }\n  .tag-repl  { background:rgba(168,71,47,.14); color:var(--kq-scene-warn); }\n  .scene-dark .tag-new { color:#e0be92; }\n  .scene-dark .tag-repl { color:#e08a72; }\n\n  @keyframes st-steam { 0%,100% { transform: translateY(0) scaleY(1); opacity:.25 } 50% { transform: translateY(-7px) scaleY(1.25); opacity:.7 } }\n\n  /* Nana cup (CSS mascot) */\n  .nana { position:relative; width:104px; height:88px; }\n  .nana .steam { position:absolute; width:5px; border-radius:4px; background:var(--nana-steam,#c9b8a0); opacity:.55; animation: st-steam 2.8s infinite ease-in-out; }\n  .nana .body { position:absolute; bottom:0; left:12px; width:72px; height:56px; border-radius:8px 8px 30px 30px; }\n  .nana .handle { position:absolute; right:2px; bottom:18px; width:22px; height:28px; border:3px solid var(--kq-scene-pencil-tint); border-left:none; border-radius:0 14px 14px 0; }\n  .nana .latte { position:absolute; top:20px; left:22px; width:52px; height:26px; border-radius:50%; background:linear-gradient(180deg,#f5e6d0,#e8cfa8 55%,#d4b080); }\n  .nana .eye { position:absolute; bottom:14px; width:7px; height:7px; border-radius:50%; background:var(--nana-eye,#8b7d9a); }\n  .nana .blush { position:absolute; bottom:9px; width:12px; height:6px; border-radius:50%; background:#c495a0; opacity:.32; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"page\" id=\"page\">\n  <div class=\"wrap\">\n\n    <!-- ── header ── -->\n    <header style=\"margin-bottom:32px;\">\n      <div class=\"eyebrow\"><span class=\"rule\"><\u002Fspan>场景视觉素材清单 · 第 0 步<\u002Fdiv>\n      <h1>风格基调页 · Style Tile<\u002Fh1>\n      <p class=\"lede\">在画任何素材之前先定调。这一页锁定：桌面材质与主色、纸张白与纸纹强度、光照方向、阴影语言、圆角与线宽、铅笔/落墨字迹语言，以及与现有 <b>kq-glass<\u002Fb> chrome 和 <b>lucide 2px<\u002Fb> 图标线宽的接缝。<b>本页 = light + dark 双主题基调 + 最终 token 表。通过后才开 P0 具体素材。<\u002Fb><\u002Fp>\n      <div class=\"callout\" style=\"margin-top:14px;\">\n        <b class=\"strong\">关键裁决 —<\u002Fb> B-5 笔记本原型里的<b> 青绿强调色 <span class=\"mono\">#2f9e8f<\u002Fspan> 属于风格漂移<\u002Fb>。真正的品牌盘（小娜杯 / 杯垫 / 聊天壳 / <code>index.css --kq-color-*<\u002Fcode> / <code>kabuqinaBrandTokens<\u002Fcode>）是<b> 薰衣草墨 + 暖拿铁<\u002Fb>。桌面纸感保留，强调色统一收回品牌盘——素材不再各说各话。\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <div class=\"grid2\">\n\n      <!-- ── 01 桌面材质与主色 ── -->\n      <section class=\"card span\" style=\"border-left:9px solid var(--kq-scene-accent);\">\n        <div class=\"sec-no\">01 · 桌面材质与主色<\u002Fdiv>\n        <div class=\"swatch-row\">\n          <div class=\"sw\"><div class=\"chip\" style=\"background:linear-gradient(180deg,var(--kq-scene-desk-a),var(--kq-scene-desk));border:1px solid var(--kq-scene-desk-edge);\"><\u002Fdiv><h4>桌面 Desk<\u002Fh4><div class=\"hex\">#e8dfd2 · edge #d4c6b2<\u002Fdiv><\u002Fdiv>\n          <div class=\"sw\"><div class=\"chip\" style=\"background:var(--kq-scene-paper);border:1px solid var(--kq-scene-paper-line);\"><\u002Fdiv><h4>纸张白 Paper<\u002Fh4><div class=\"hex\">#fbf8f1 · line #e7e0d2<\u002Fdiv><\u002Fdiv>\n          <div class=\"sw\"><div class=\"chip\" style=\"background:linear-gradient(135deg,#6b5580,#8f75a8);\"><\u002Fdiv><h4>主色 · 薰衣草墨<\u002Fh4><div class=\"hex\">#6b5580 → #8f75a8<\u002Fdiv><\u002Fdiv>\n          <div class=\"sw\"><div class=\"chip\" style=\"background:linear-gradient(135deg,#e8cfa8,#d4b080);\"><\u002Fdiv><h4>暖色 · 拿铁 Latte<\u002Fh4><div class=\"hex\">#d4b080 (latte.outer)<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"swatch-row\" style=\"grid-template-columns:repeat(3,1fr);margin-top:22px;\">\n          <div style=\"border-radius:12px;overflow:hidden;border:1px solid var(--kq-scene-paper-line);\">\n            <div style=\"height:64px;background:var(--kq-scene-paper);background-image:var(--noise-a002);\"><\u002Fdiv>\n            <div style=\"padding:8px 11px;font-size:12.5px;color:var(--kq-scene-muted);background:var(--kq-scene-card);\">纸纹 0.02 α · <b class=\"strong\">留白页<\u002Fb>（几乎无纹）<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-radius:12px;overflow:hidden;border:1px solid var(--kq-scene-paper-line);\">\n            <div style=\"height:64px;background:var(--kq-scene-paper);background-image:var(--kq-scene-noise);\"><\u002Fdiv>\n            <div style=\"padding:8px 11px;font-size:12.5px;color:var(--kq-scene-muted);background:var(--kq-scene-card);\">纸纹 <b class=\"strong\">0.035 α · 推荐<\u002Fb>（纸感够、不脏）<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-radius:12px;overflow:hidden;border:1px solid var(--kq-scene-paper-line);\">\n            <div style=\"height:64px;background:var(--kq-scene-paper);background-image:var(--noise-a08);\"><\u002Fdiv>\n            <div style=\"padding:8px 11px;font-size:12.5px;color:var(--kq-scene-muted);background:var(--kq-scene-card);\">纸纹 0.08 α · <b style=\"color:var(--kq-scene-warn);\">太重<\u002Fb>（发灰、上限外）<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"note\" style=\"margin:16px 0 0;\">纹理一律内嵌 SVG <code>feTurbulence<\u002Fcode>；位图纹理禁令（愿景 §7）。桌面 = CSS 渐变 + 噪点参数化，不给位图。<\u002Fp>\n      <\u002Fsection>\n\n      <!-- ── 02 语义色板 ── -->\n      <section class=\"card\">\n        <div class=\"sec-no\">02 · 语义色板（接 --kq-color-*）<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:0;\">\n          <div style=\"display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed var(--kq-scene-paper-line);\"><span style=\"width:34px;height:34px;border-radius:9px;background:#49385e;flex-shrink:0;\"><\u002Fspan><div style=\"flex:1;\"><b class=\"strong\">墨字 ink-strong<\u002Fb><div class=\"note\">标题 / 落墨正文<\u002Fdiv><\u002Fdiv><code style=\"color:var(--kq-scene-accent);\">#49385e<\u002Fcode><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed var(--kq-scene-paper-line);\"><span style=\"width:34px;height:34px;border-radius:9px;background:#5a4a6a;flex-shrink:0;\"><\u002Fspan><div style=\"flex:1;\"><b class=\"strong\">正文 ink<\u002Fb><div class=\"note\">默认字色<\u002Fdiv><\u002Fdiv><code style=\"color:var(--kq-scene-accent);\">#5a4a6a<\u002Fcode><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed var(--kq-scene-paper-line);\"><span style=\"width:34px;height:34px;border-radius:9px;background:#7a6494;flex-shrink:0;\"><\u002Fspan><div style=\"flex:1;\"><b class=\"strong\">辅助 muted <span class=\"pill tag-repl\">替换<\u002Fspan><\u002Fb><div class=\"note\">小字说明 / 元信息 · 4.86:1<\u002Fdiv><\u002Fdiv><code style=\"color:var(--kq-scene-accent);\">#7a6494<\u002Fcode><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed var(--kq-scene-paper-line);\"><span style=\"width:34px;height:34px;border-radius:9px;background:#7d61a0;flex-shrink:0;\"><\u002Fspan><div style=\"flex:1;\"><b class=\"strong\">铅笔字 pencil <span class=\"pill tag-repl\">替换<\u002Fspan><\u002Fb><div class=\"note\">草稿文字（斜体+手写）· 4.84:1<\u002Fdiv><\u002Fdiv><code style=\"color:var(--kq-scene-accent);\">#7d61a0<\u002Fcode><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed var(--kq-scene-paper-line);\"><span style=\"width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#6b5580,#8f75a8);flex-shrink:0;\"><\u002Fspan><div style=\"flex:1;\"><b class=\"strong\">强调 accent<\u002Fb><div class=\"note\">书脊 / 激活标签 / 主按钮<\u002Fdiv><\u002Fdiv><code style=\"color:var(--kq-scene-accent);\">#6b5580<\u002Fcode><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed var(--kq-scene-paper-line);\"><span style=\"width:34px;height:34px;border-radius:9px;background:#f5effa;border:1px solid #d8cbe6;flex-shrink:0;\"><\u002Fspan><div style=\"flex:1;\"><b class=\"strong\">强调-软 accent-soft<\u002Fb><div class=\"note\">旁注气泡 / 已收藏底 = coaster.bg<\u002Fdiv><\u002Fdiv><code style=\"color:var(--kq-scene-accent);\">#f5effa<\u002Fcode><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed var(--kq-scene-paper-line);\"><span style=\"width:34px;height:34px;border-radius:9px;background:#d4b080;flex-shrink:0;\"><\u002Fspan><div style=\"flex:1;\"><b class=\"strong\">暖 warm / latte<\u002Fb><div class=\"note\">书签 / 杂记本 / 咖啡暖点<\u002Fdiv><\u002Fdiv><code style=\"color:var(--kq-scene-accent);\">#d4b080<\u002Fcode><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;padding:8px 0;\"><span style=\"width:34px;height:34px;border-radius:9px;background:#a8472f;flex-shrink:0;\"><\u002Fspan><div style=\"flex:1;\"><b class=\"strong\">警示 warn <span class=\"pill tag-repl\">替换<\u002Fspan><\u002Fb><div class=\"note\">错题本边 / 到期徽标 · 5.49:1<\u002Fdiv><\u002Fdiv><code style=\"color:var(--kq-scene-accent);\">#a8472f<\u002Fcode><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- ── 03 光照 + 阴影 ── -->\n      <section class=\"card\">\n        <div class=\"sec-no\">03 · 光照方向 + 阴影语言<\u002Fdiv>\n        <div style=\"display:flex;gap:20px;align-items:center;margin-bottom:22px;\">\n          <div style=\"position:relative;width:132px;height:100px;border-radius:12px;background:var(--kq-scene-desk-a);border:1px solid var(--kq-scene-desk-edge);flex-shrink:0;overflow:hidden;\">\n            <div style=\"position:absolute;top:-14px;left:-14px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6df,#e8cfa8 60%,transparent 72%);\"><\u002Fdiv>\n            <div style=\"position:absolute;left:16px;top:12px;font-size:11px;color:var(--kq-scene-muted);\">↖ 光源<\u002Fdiv>\n            <div style=\"position:absolute;right:26px;bottom:22px;width:44px;height:34px;border-radius:8px;background:var(--kq-scene-paper);box-shadow:6px 8px 12px rgba(90,74,106,.22);border:1px solid var(--kq-scene-paper-line);\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:13.5px;color:var(--kq-scene-ink);\">光源固定 <b class=\"strong\">左上（↖）<\u002Fb>，全套素材统一。投影一律落向 <b class=\"strong\">右下<\u002Fb>；高光落在物体左上棱。<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"grid2\" style=\"gap:16px;\">\n          <div>\n            <div style=\"height:76px;border-radius:12px;background:var(--kq-scene-card);box-shadow:var(--kq-scene-shadow-near),var(--kq-scene-shadow-far);border:1px solid var(--kq-scene-card-border);\"><\u002Fdiv>\n            <div class=\"note\" style=\"margin-top:9px;\"><b class=\"strong\">柔和双层 · 卡片/本子<\u002Fb><br>近层 2/6 + 远层 14/34<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"height:76px;border-radius:12px;background:var(--kq-scene-card);box-shadow:0 1px 2px rgba(90,74,106,.10),0 4px 10px rgba(90,74,106,.12);border:1px solid var(--kq-scene-card-border);transform:rotate(-.8deg);\"><\u002Fdiv>\n            <div class=\"note\" style=\"margin-top:9px;\"><b class=\"strong\">夹页/活页 · 更贴纸面<\u002Fb><br>单层近影 + 微旋转<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"note\" style=\"margin:16px 0 0;\">阴影色 = 墨 <code>#5a4a6a<\u002Fcode> 低透明（shadow.ink），不用纯黑；接触影更实（α.38），漂浮影更散（α.08）。dark 主题下阴影转黑 + 1px 高光描边。<\u002Fp>\n      <\u002Fsection>\n\n      <!-- ── 04 圆角 + 线宽 ── -->\n      <section class=\"card\">\n        <div class=\"sec-no\">04 · 圆角半径 + lucide 线宽<\u002Fdiv>\n        <div style=\"display:flex;gap:14px;align-items:flex-end;margin-bottom:22px;\">\n          <div style=\"text-align:center;\"><div style=\"width:56px;height:44px;background:var(--kq-scene-accent-soft);border:1.5px solid var(--kq-scene-accent-2);border-radius:3px;\"><\u002Fdiv><div class=\"note\" style=\"margin-top:6px;\">3 活页<\u002Fdiv><\u002Fdiv>\n          <div style=\"text-align:center;\"><div style=\"width:56px;height:44px;background:var(--kq-scene-accent-soft);border:1.5px solid var(--kq-scene-accent-2);border-radius:8px;\"><\u002Fdiv><div class=\"note\" style=\"margin-top:6px;\">8 按钮<\u002Fdiv><\u002Fdiv>\n          <div style=\"text-align:center;\"><div style=\"width:56px;height:44px;background:var(--kq-scene-accent-soft);border:1.5px solid var(--kq-scene-accent-2);border-radius:12px;\"><\u002Fdiv><div class=\"note\" style=\"margin-top:6px;\">12 卡片<\u002Fdiv><\u002Fdiv>\n          <div style=\"text-align:center;\"><div style=\"width:56px;height:44px;background:var(--kq-scene-accent-soft);border:1.5px solid var(--kq-scene-accent-2);border-radius:14px;\"><\u002Fdiv><div class=\"note\" style=\"margin-top:6px;\">14 本子<\u002Fdiv><\u002Fdiv>\n          <div style=\"text-align:center;\"><div style=\"width:56px;height:44px;background:var(--kq-scene-accent-soft);border:1.5px solid var(--kq-scene-accent-2);border-radius:999px;\"><\u002Fdiv><div class=\"note\" style=\"margin-top:6px;\">999 chip<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"note\" style=\"margin-bottom:10px;\">生命周期分页图标 ×5 · 16–20px · <b class=\"strong\">stroke-width 2<\u002Fb> · round cap/join（与 lucide 一致）<\u002Fdiv>\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap;\">\n          <div style=\"width:52px;height:52px;border-radius:12px;background:var(--kq-scene-
