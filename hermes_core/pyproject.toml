[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kabuqina-agent"
version = "0.11.0"
description = "The Kabuqina-owned agent core for the Kabuqina Windows desktop app"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kabuqina Contributors" }]
license = { text = "MIT" }
dependencies = [
  # Core — pinned to known-good ranges to limit supply chain attack surface
  "openai>=2.21.0,<3",
  "anthropic>=0.39.0,<1",
  "python-dotenv>=1.2.1,<2",
  "fire>=0.7.1,<1",
  "httpx[socks]>=0.28.1,<1",
  "rich>=14.3.3,<15",
  "tenacity>=9.1.4,<10",
  "pyyaml>=6.0.2,<7",
  "requests>=2.33.0,<3",  # CVE-2026-25645
  "jinja2>=3.1.5,<4",
  "pydantic>=2.12.5,<3",
  # Terminal and approval helpers use prompt_toolkit integration points.
  "prompt_toolkit>=3.0.52,<4",
  # Phase 3.5 agent graph engine. Low-level StateGraph only; langchain-core /
  # langgraph-checkpoint / langgraph-prebuilt / langgraph-sdk / langsmith are
  # accepted transitive deps and must not be imported outside the graph builder.
  "langgraph==1.2.6",
  # Tools
  "exa-py>=2.9.0,<3",
  "firecrawl-py>=4.16.0,<5",
  "parallel-web>=0.4.2,<1",
  "fal-client>=0.13.1,<1",
  # Cron scheduler (built-in feature — scheduled cron/interval jobs use croniter).
  "croniter>=6.0.0,<7",
  # Text-to-speech (Edge TTS is free, no API key needed)
  "edge-tts>=7.2.7,<8",
  # Skills Hub (GitHub App JWT auth — optional, only needed for bot identity)
  "PyJWT[crypto]>=2.12.0,<3",  # CVE-2026-32597
]

[project.optional-dependencies]
modal = ["modal>=1.0.0,<2"]
daytona = ["daytona>=0.148.0,<1"]
vercel = ["vercel>=0.5.7,<0.6.0"]
dev = [
  "debugpy>=1.8.0,<2",
  "pytest>=9.0.2,<10",
  "pytest-asyncio>=1.3.0,<2",
  "pytest-xdist>=3.0,<4",
  "mcp>=1.2.0,<2",
  "Pillow>=11.0.0,<12",
  "python-docx>=1.1.2,<2",
  "pypdf>=5.1.0,<6",
  "sympy>=1.13,<2",
  "numpy>=1.26,<3",
  "ty>=0.0.1a29,<0.0.22",
  "ruff",
]
messaging = ["python-telegram-bot[webhooks]>=22.6,<23", "aiohttp>=3.13.3,<4", "slack-bolt>=1.18.0,<2", "slack-sdk>=3.27.0,<4", "qrcode>=7.0,<8"]
cron = []  # croniter is now a core dependency; this extra kept for back-compat
slack = ["slack-bolt>=1.18.0,<2", "slack-sdk>=3.27.0,<4"]
matrix = ["mautrix[encryption]>=0.20,<1", "Markdown>=3.6,<4", "aiosqlite>=0.20", "asyncpg>=0.29", "aiohttp-socks>=0.10,<1"]
tts-premium = ["elevenlabs>=1.0,<2"]
voice = [
  # Local STT pulls in wheel-only transitive deps (ctranslate2, onnxruntime),
  # so keep it out of the base install for source-build packagers like Homebrew.
  "faster-whisper>=1.0.0,<2",
  "sounddevice>=0.4.6,<1",
  "numpy>=1.24.0,<3",
]
pty = [
  "ptyprocess>=0.7.0,<1; sys_platform != 'win32'",
  "pywinpty>=2.0.0,<3; sys_platform == 'win32'",
]
honcho = ["honcho-ai>=2.0.1,<3"]
mcp = ["mcp>=1.2.0,<2"]
homeassistant = ["aiohttp>=3.9.0,<4"]
sms = ["aiohttp>=3.9.0,<4"]
acp = ["agent-client-protocol>=0.9.0,<0.11"]
mistral = ["mistralai>=2.3.0,<3"]
termux = [
  # Tested Android / Termux path: avoids extras that currently depend on
  # non-Android wheels (notably faster-whisper -> ctranslate2 via the voice
  # extra).
  "python-telegram-bot[webhooks]>=22.6,<23",
  "kabuqina-agent[cron]",
  "kabuqina-agent[pty]",
  "kabuqina-agent[mcp]",
  "kabuqina-agent[honcho]",
  "kabuqina-agent[acp]",
]
dingtalk = ["dingtalk-stream>=0.20,<1", "alibabacloud-dingtalk>=2.0.0", "qrcode>=7.0,<8"]
google = [
  # Required by the google-workspace skill (Gmail, Calendar, Drive, Contacts,
  # Sheets, Docs).  Declared here so packagers (Nix, Homebrew) ship them with
  # the [all] extra and users don't hit runtime `pip install` paths that fail
  # in environments without pip (e.g. Nix-managed Python).
  "google-api-python-client>=2.100,<3",
  "google-auth-oauthlib>=1.0,<2",
  "google-auth-httplib2>=0.2,<1",
]
# `hermes dashboard` (localhost SPA + API).  Not in core to keep the default install lean.
web = ["fastapi>=0.104.0,<1", "uvicorn[standard]>=0.24.0,<1"]
rl = [
  "atroposlib @ git+https://github.com/NousResearch/atropos.git@c20c85256e5a45ad31edf8b7276e9c5ee1995a30",
  "tinker @ git+https://github.com/thinking-machines-lab/tinker.git@30517b667f18a3dfb7ef33fb56cf686d5820ba2b",
  "fastapi>=0.104.0,<1",
  "uvicorn[standard]>=0.24.0,<1",
  "wandb>=0.15.0,<1",
]
yc-bench = ["yc-bench @ git+https://github.com/collinear-ai/yc-bench.git@bfb0c88062450f46341bd9a5298903fc2e952a5c ; python_version >= '3.12'"]
all = [
  "kabuqina-agent[modal]",
  "kabuqina-agent[daytona]",
  "kabuqina-agent[vercel]",
  "kabuqina-agent[messaging]",
  # matrix: python-olm (required by matrix-nio[e2e]) is upstream-broken on
  # modern macOS (archived libolm, C++ errors with Clang 21+).  On Linux the
  # [matrix] extra's own marker pulls in the [e2e] variant automatically.
  "kabuqina-agent[matrix]; sys_platform == 'linux'",
  "kabuqina-agent[cron]",
  "kabuqina-agent[dev]",
  "kabuqina-agent[tts-premium]",
  "kabuqina-agent[slack]",
  "kabuqina-agent[pty]",
  "kabuqina-agent[honcho]",
  "kabuqina-agent[mcp]",
  "kabuqina-agent[homeassistant]",
  "kabuqina-agent[sms]",
  "kabuqina-agent[acp]",
  "kabuqina-agent[voice]",
  "kabuqina-agent[dingtalk]",
  "kabuqina-agent[google]",
  "kabuqina-agent[mistral]",
  "kabuqina-agent[web]",
]

[project.scripts]
kabuqina = "run_agent:main"
kabuqina-agent = "run_agent:main"
kabuqina-acp = "acp_adapter.entry:main"
# One-release aliases for existing automation.
hermes = "run_agent:main"
hermes-agent = "run_agent:main"
hermes-acp = "acp_adapter.entry:main"

[tool.setuptools]
py-modules = ["run_agent", "model_tools", "toolsets", "batch_runner", "trajectory_compressor", "toolset_distributions", "kabuqina_constants", "kabuqina_state", "kabuqina_time", "kabuqina_logging", "hermes_constants", "hermes_state", "hermes_time", "hermes_logging", "rl_cli", "utils"]

[tool.setuptools.packages.find]
include = ["agent", "agent.*", "tools", "tools.*", "kabuqina_cli", "kabuqina_cli.*", "hermes_cli", "hermes_cli.*", "gateway", "gateway.*", "cron", "acp_adapter", "plugins", "plugins.*", "learning", "learning.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring external services (API keys, Modal, etc.)",
]
addopts = "-m 'not integration' -n auto"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
unknown-argument = "warn"
redundant-cast = "ignore"

[tool.ty.src]
exclude = ["**"]

[[tool.ty.overrides]]
include = ["**"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"
invalid-method-override = "ignore"
invalid-assignment = "ignore"
not-iterable = "ignore"

[tool.ruff]
exclude = ["*"]

[tool.uv]
exclude-newer = "7 days"
