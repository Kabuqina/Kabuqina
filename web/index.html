<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/kabuqina_na.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/kabuqina_na_32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/kabuqina_na_48.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Nana</title>
    <script>
      (function () {
        var key = "kabuqina.ui.themeMode";
        var mode = localStorage.getItem(key) || localStorage.getItem("hermesdesk.ui.themeMode") || "system";
        if (mode && !localStorage.getItem(key)) localStorage.setItem(key, mode);
        if (mode !== "system" && mode !== "light" && mode !== "dark") {
          mode = "system";
        }
        var dark =
          mode === "dark" ||
          (mode === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.themeMode = mode;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
